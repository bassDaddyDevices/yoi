# nginx: auth.bass-daddy.com -> the license server. HTTPS via Let's Encrypt:
#   sudo certbot --nginx -d auth.bass-daddy.com
# Rate limit /activate so nobody can guess keys quickly (put limit_req_zone in the http block).
limit_req_zone $binary_remote_addr zone=bdd_activate:1m rate=20r/m;

server {
    listen 80;
    server_name auth.bass-daddy.com;

    location = /activate {
        limit_req zone=bdd_activate burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
