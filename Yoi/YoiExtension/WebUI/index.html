<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YOI</title>
    <link rel="stylesheet" href="bdd-modern.css">
    <link rel="stylesheet" href="yoi-modern.css">
</head>
<body>
    <main id="stage" class="yoi-modern" aria-label="YOI instrument">
        <header class="topbar">
            <div class="brand">
                <span class="wordmark">YOI</span>
                <span class="maker">BASS DADDY DEVICES</span>
            </div>
            <div id="badge" class="badge" hidden></div>
            <div class="preset-placeholder" aria-label="Preset browser coming later">
                <span class="eyebrow">PRESET</span>
                <span class="preset-name">—</span>
                <span class="coming-soon">PRESETS COMING LATER</span>
            </div>
            <button id="details-toggle" class="details-toggle" type="button" aria-expanded="false" aria-controls="details-sheet">DETAILS</button>
        </header>

        <section class="main-row" aria-label="Envelope and character">
            <section class="drawing-card bdd-card" aria-label="Drawn envelope">
                <div class="drawing-head">
                    <span class="section-title">FILTER MOVEMENT</span>
                    <button id="drawings" class="drawing-button" type="button" aria-label="Load a factory drawing">DRAWINGS ▾</button>
                </div>
                <div class="drawing-well bdd-well">
                    <canvas id="curve" aria-label="Drawn envelope for the filter cutoff. Click to add a point, drag to move one."></canvas>
                    <div class="curve-hint" id="hint" aria-live="polite"></div>
                </div>
                <div class="drawing-controls">
                    <div class="motion-controls" id="motion-controls"></div>
                    <div class="amount-control" id="amount-control"></div>
                </div>
            </section>

            <section class="character-card bdd-card" aria-label="Character controls">
                <div class="card-heading">
                    <span class="section-title">CHARACTER</span>
                    <span class="character-values"><span>THROAT <b id="throat-value"></b></span><span>RES <b id="res-value"></b></span></span>
                </div>
                <div id="character-pad" class="character-pad"></div>
                <div class="character-controls">
                    <div class="ds-controls">
                        <div id="ds-mode"></div>
                        <div id="ds-lock"></div>
                    </div>
                    <div id="ds-value"></div>
                </div>
            </section>

            <aside class="level-card bdd-card" aria-label="Output level">
                <span class="section-title">LEVEL</span>
                <div id="level-control"></div>
            </aside>
        </section>

        <section class="bottom-row" aria-label="Performance controls">
            <div class="macro-row" id="macro-row"></div>
            <div class="cutoff-card bdd-card" id="cutoff-card">
                <div class="cutoff-dial" id="cutoff-dial"></div>
                <div class="cutoff-mode" id="cutoff-mode"></div>
            </div>
        </section>

        <section id="details-sheet" class="details-sheet" aria-label="Additional controls" aria-hidden="true">
            <div class="sheet-header">
                <div>
                    <span class="eyebrow">YOI SETTINGS</span>
                    <h2>Details</h2>
                </div>
                <button id="details-close" class="close-button" type="button" aria-label="Close details">×</button>
            </div>
            <div id="details-tabs" class="details-tabs"></div>
            <div class="sheet-content">
                <section class="details-page" data-page="0" aria-label="Voice settings"></section>
                <section class="details-page" data-page="1" aria-label="Envelope settings" hidden></section>
                <section class="details-page" data-page="2" aria-label="Finish settings" hidden></section>
            </div>
        </section>
    </main>

    <script src="bdd-bridge.js"></script>
    <script src="bdd-pixel.js"></script>
    <script src="bdd-controls.js"></script>
    <script src="bdd-curve.js"></script>
    <script src="yoi-standin.js"></script>
    <script src="yoi-panel.js"></script>
</body>
</html>
