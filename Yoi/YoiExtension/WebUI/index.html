<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YOI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>YOI</h1>
        <label class="shape-picker">
            Load drawing
            <select id="shapes"></select>
        </label>
        <span id="status" class="status">connecting…</span>
    </header>

    <section class="envelope">
        <canvas id="curve" aria-label="Drawn envelope: drag the points to reshape it"></canvas>
    </section>

    <main id="controls"></main>

    <script src="bridge.js"></script>
    <script src="standin.js"></script>
    <script src="panel.js"></script>
</body>
</html>
