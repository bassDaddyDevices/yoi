<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YOI</title>
    <link rel="stylesheet" href="bdd-modern.css">
    <link rel="stylesheet" href="yoi-modern.css">
</head>
<body>
    <main id="stage" class="yoi-modern" aria-label="YOI instrument">
        <header class="topbar">
            <div class="brand">
                <span class="wordmark">YOI</span>
                <span class="maker">BASS DADDY DEVICES</span>
            </div>
            <div id="badge" class="badge" hidden></div>
            <div id="preset-controls" class="preset-controls" aria-label="Presets">
                <button id="preset-select" class="preset-select" type="button" aria-haspopup="listbox" aria-label="Select preset">
                    <span class="preset-kicker">PRESET</span>
                    <span id="preset-name" class="preset-name">UNSAVED PATCH</span>
                    <span class="preset-chevron" aria-hidden="true">▾</span>
                </button>
                <button id="preset-save" class="preset-action" type="button">SAVE AS</button>
                <button id="preset-delete" class="preset-action delete" type="button" disabled>DELETE</button>
                <span id="preset-status" class="preset-status" role="status" hidden></span>
            </div>
            <button id="license-badge" class="license-badge" type="button" hidden title="Activate YOI">DEMO · ACTIVATE</button>
            <button id="details-toggle" class="details-toggle" type="button" aria-expanded="false" aria-controls="details-sheet">SETTINGS</button>
        </header>

        <section class="main-row" aria-label="Envelope and character">
            <section class="drawing-card bdd-card" aria-label="Drawn envelope">
                <div class="drawing-head">
                    <span class="section-title">FILTER MOVEMENT</span>
                    <button id="drawings" class="drawing-button" type="button" aria-label="Load a factory drawing">DRAWINGS ▾</button>
                </div>
                <div class="drawing-well bdd-well">
                    <canvas id="curve" aria-label="Drawn envelope for the filter cutoff. Click to add a point, drag to move one."></canvas>
                    <div class="curve-hint" id="hint" aria-live="polite"></div>
                </div>
                <div class="drawing-controls">
                    <div class="motion-controls" id="motion-controls"></div>
                    <div class="amount-control" id="amount-control"></div>
                </div>
            </section>

            <section class="character-card bdd-card" aria-label="Character controls">
                <div class="card-heading">
                    <span class="section-title">CHARACTER</span>
                    <span class="character-values"><span>THROAT <b id="throat-value"></b></span><span>RES <b id="res-value"></b></span></span>
                </div>
                <div id="character-pad" class="character-pad"></div>
                <div class="character-controls">
                    <div class="ds-controls">
                        <div id="ds-mode"></div>
                        <div id="ds-lock"></div>
                    </div>
                </div>
            </section>
        </section>

        <section class="bottom-row" aria-label="Performance controls">
            <div class="macro-row" id="macro-row"></div>
            <div class="cutoff-card bdd-card" id="cutoff-card">
                <div class="cutoff-dial" id="cutoff-dial"></div>
                <div class="cutoff-mode" id="cutoff-mode"></div>
            </div>
        </section>

        <!-- Its own column beside both rows, so the fader runs from the top card to the bottom. -->
        <aside class="level-card bdd-card" aria-label="Output level">
            <span class="section-title">LEVEL</span>
            <div id="level-control"></div>
        </aside>

        <section id="details-sheet" class="details-sheet" aria-label="Settings" aria-hidden="true">
            <div class="sheet-header">
                <div>
                    <span class="eyebrow">YOI</span>
                    <h2>Settings</h2>
                </div>
                <button id="details-close" class="close-button" type="button" aria-label="Close settings">×</button>
            </div>
            <div id="details-tabs" class="details-tabs"></div>
            <div class="sheet-content">
                <section class="details-page" data-page="0" aria-label="Voice settings"></section>
                <section class="details-page" data-page="1" aria-label="Envelope settings" hidden></section>
                <section class="details-page" data-page="2" aria-label="Finish settings" hidden></section>
                <section class="details-page license-page" data-page="3" aria-label="License" hidden>
                    <section class="detail-section license-section">
                        <h3>LICENSE</h3>
                        <p id="license-summary" class="license-summary"></p>
                        <form id="license-form" class="license-form">
                            <label class="preset-name-field" for="license-input">KEY FROM YOUR RECEIPT, OR A LICENSE
                                <textarea id="license-input" rows="3" autocomplete="off" spellcheck="false" placeholder="Paste here, or drop a .bddlicense file"></textarea>
                            </label>
                            <div class="preset-dialog-actions">
                                <button id="license-paste" class="preset-action" type="button" title="Paste from the clipboard and activate">PASTE &amp; ACTIVATE</button>
                                <button id="license-activate" class="preset-action primary" type="submit">ACTIVATE</button>
                            </div>
                        </form>
                        <p id="license-message" class="license-message" role="status"></p>
                        <p class="license-help">No internet on this computer? Get a license file at auth.bass-daddy.com on another one, then paste or drop it here.</p>
                    </section>
                </section>
            </div>
        </section>
        <section id="preset-dialog" class="preset-dialog" role="dialog" aria-modal="true" aria-labelledby="preset-dialog-title" hidden>
            <form id="preset-form" class="preset-dialog-card">
                <div class="preset-dialog-heading">
                    <span id="preset-dialog-kicker" class="eyebrow">USER PRESET</span>
                    <button id="preset-dialog-close" class="close-button" type="button" aria-label="Close dialog">×</button>
                </div>
                <h2 id="preset-dialog-title">Save preset</h2>
                <p id="preset-dialog-message">Name this sound so you can find it again.</p>
                <label id="preset-name-field" class="preset-name-field">NAME<input id="preset-name-input" type="text" maxlength="80" autocomplete="off" spellcheck="false"></label>
                <div class="preset-dialog-actions">
                    <button id="preset-cancel" class="preset-action" type="button">CANCEL</button>
                    <button id="preset-confirm" class="preset-action primary" type="submit">SAVE PRESET</button>
                </div>
            </form>
        </section>
    </main>

    <script src="bdd-bridge.js"></script>
    <script src="bdd-pixel.js"></script>
    <script src="bdd-controls.js"></script>
    <script src="bdd-curve.js"></script>
    <script src="yoi-standin.js"></script>
    <script src="yoi-panel.js"></script>
</body>
</html>
